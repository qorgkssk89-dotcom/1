<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      main section.christmas {
        width: 100%;
        height: 400px;
        background-image: url(https://image.istarbucks.co.kr/upload/common/img/main/2025/251021_pc_reserve_bg.jpg);
        background-size: cover;
        background-position: center;
        position: relative;
        overflow: hidden; /* 오른쪽 이미지가 넘쳐도 깔끔하게 */
      }

      main section.christmas .christmas-inner {
        width: 1100px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        position: relative;
        z-index: 2; /* 위로 올려서 이미지와 배경 분리 */
      }

      main section.christmas .left {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        color: #fff;
      }

      main section.christmas .left img {
        width: 436px;
        height: auto;
        display: block;
      }

      main section.christmas .left .btn-detail {
        padding: 10px 22px;
        border: 1px solid #d0923e;
        border-radius: 4px;
        color: #d0923e;
        transition: 0.25s;
        font-size: 14px;
      }

      main section.christmas .left .btn-detail:hover {
        background: #d0923e;
        color: #fff;
        text-decoration: underline;
      }

      /* ⭐ 오른쪽 이미지 — 공홈 100% 동일 구조 */
      main section.christmas .right {
        position: absolute;
        bottom: 0;
        right: -260px; /* 공홈 기준값 */
        z-index: 1;
      }

      main section.christmas .right img {
        width: 1200px; /* 공홈의 진짜 이미지 폭 */
        height: auto;
        display: block;
        max-width: none; /* 1200px 그대로 유지 */
      }
    </style>
  </head>
  <body>
    <section class="christmas">
      <div class="christmas-inner">
        <div class="left">
          <img
            class="title-img"
            src="https://image.istarbucks.co.kr/upload/common/img/main/2025/251021_pc_reserve_title.png"
          />
          <a href="#" class="btn-detail">자세히 보기</a>
        </div>

        <!-- 공홈은 오른쪽 이미지를 background가 아니라 absolute로 둠 -->
        <div class="right-image">
          <img
            src="https://image.istarbucks.co.kr/upload/common/img/main/2025/251021_pc_reserve_coffee.png"
            alt=""
          />
        </div>
      </div>
    </section>
  </body>
</html>
